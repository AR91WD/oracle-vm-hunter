name: Keepalive
# Defeats GitHub's 60-day auto-disable of scheduled workflows on inactive repos.
# Commits a timestamp weekly + re-enables hunter if GitHub disabled it for inactivity.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit heartbeat + re-enable hunter if inactive-disabled
        shell: bash {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set +e
          date -u > .keepalive
          git config user.name "keepalive-bot"
          git config user.email "keepalive@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive $(date -u '+%Y-%m-%d')" || echo "nothing to commit"
          if ! git push; then
            echo "::error::keepalive git push failed"
            PUSH_FAILED=1
          fi

          # If GitHub auto-disabled hunter for inactivity, re-enable it
          state=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/retry-vm.yml" \
            | grep -o '"state":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [ "$state" = "disabled_inactivity" ]; then
            curl -s -X PUT -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GH_REPO/actions/workflows/retry-vm.yml/enable" > /dev/null 2>&1
            curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GH_REPO/actions/workflows/retry-vm.yml/dispatches" \
              -d '{"ref":"main"}' > /dev/null 2>&1
            curl -s --max-time 10 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              -d "text=♻️ GitHub усыпил hunter за неактивность — я его разбудил и перезапустил. Охота продолжается." > /dev/null 2>&1
          fi
          echo "keepalive done, hunter state: $state"
          [ "$PUSH_FAILED" = "1" ] && exit 1
          exit 0
