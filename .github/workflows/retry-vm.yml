name: Oracle VM Hunter
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: vm-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        ad:
          - "gukW:EU-FRANKFURT-1-AD-1"
          - "gukW:EU-FRANKFURT-1-AD-2"
          - "gukW:EU-FRANKFURT-1-AD-3"
    steps:
      - uses: actions/checkout@v4
      - name: Progressive hunt on dedicated runner IP
        shell: bash {0}
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
          SSH_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          AD: ${{ matrix.ad }}
          SUBNET: "ocid1.subnet.oc1.eu-frankfurt-1.aaaaaaaakgx7op4hgzjmo2afhzkhhmduhyydwnenkdc5zy63cxysh3fab5ba"
          IMAGE: "ocid1.image.oc1.eu-frankfurt-1.aaaaaaaa4xniimqv2um47gmhf235bwj2wm45roe55dxxwmhfzqtrm6a3ggeq"
          OCI_REGION: "eu-frankfurt-1"
          TARGET_OCPU: "4"
          DURATION: "230"
          SOURCE: "GH"
        run: |
          set +e
          echo "$OCI_KEY" > /tmp/oci-key.pem
          chmod 600 /tmp/oci-key.pem
          export KEY_FILE=/tmp/oci-key.pem
          # Stagger the 3 matrix runners so they don't hit Oracle in the same instant
          case "${AD##*-}" in 1) sleep 0;; 2) sleep 4;; 3) sleep 8;; esac
          bash hunt.sh
          rm -f /tmp/oci-key.pem

  relaunch:
    needs: hunt
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect STATS telemetry from the previous generation's hunt logs
        id: stats
        shell: bash {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          # Deliberately reads the PREVIOUS run's logs, not this run's own —
          # live-tested and found GitHub's log archival can lag well past 30s
          # behind job completion, and relaunch starts within seconds of the
          # last matrix worker finishing, so fetching *this* run's own logs
          # races log availability by construction (confirmed: the same run's
          # STATS lines were retrievable a few minutes later, just not yet at
          # relaunch-time). Reading the previous run instead — which finished
          # a full ~5min generation cycle ago — sidesteps the race entirely.
          # A run_id-tagged dedup guard on stats-gh.ndjson prevents ever
          # double-recording the same source run if this logic overlaps.
          PREV_RUN_ID=$(gh run list -R "$GH_REPO" --workflow=retry-vm.yml --status completed \
            --limit 5 --json databaseId,createdAt -q 'sort_by(.createdAt) | reverse | .[].databaseId' \
            | grep -v "^${CURRENT_RUN_ID}$" | head -1)

          if [ -z "$PREV_RUN_ID" ]; then
            echo "[stats] no previous completed run found — skipping this cycle"
            echo "has_stats=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "[stats] reading logs from previous run ${PREV_RUN_ID} (current: ${CURRENT_RUN_ID})"

          # Dedup guard: skip if we already recorded this source run.
          if [ -f stats-gh.ndjson ] && grep -q "\"src_run\":${PREV_RUN_ID}[,}]" stats-gh.ndjson; then
            echo "[stats] run ${PREV_RUN_ID} already recorded — skipping"
            echo "has_stats=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LOG=$(gh run view "$PREV_RUN_ID" -R "$GH_REPO" --log 2>/dev/null)
          STATS_PAYLOADS=$(echo "$LOG" | grep -o 'STATS [0-9]* {.*}' | sed -E 's/^STATS [0-9]+ //')
          if [ -z "$STATS_PAYLOADS" ]; then
            echo "[stats] no STATS lines found in run ${PREV_RUN_ID}'s logs — skipping record"
            echo "has_stats=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          WORKERS=""
          N=0
          while IFS= read -r payload; do
            [ -z "$payload" ] && continue
            N=$((N + 1))
            if [ -z "$WORKERS" ]; then WORKERS="$payload"; else WORKERS="${WORKERS},${payload}"; fi
          done <<< "$STATS_PAYLOADS"

          if [ "$N" -eq 0 ]; then
            echo "[stats] no valid STATS payloads parsed — skipping record"
            echo "has_stats=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "{\"ts\":$(date -u +%s),\"source\":\"GH\",\"src_run\":${PREV_RUN_ID},\"workers\":[${WORKERS}]}" >> stats-gh.ndjson
          echo "[stats] appended record with ${N} worker(s) from run ${PREV_RUN_ID}"
          echo "has_stats=1" >> "$GITHUB_OUTPUT"

      - name: Commit + push stats-gh.ndjson
        if: steps.stats.outputs.has_stats == '1'
        shell: bash {0}
        run: |
          set +e
          git config user.name "vm-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats-gh.ndjson

          push_once() {
            git commit -m "stats: append GH generation telemetry [skip ci]" --quiet
            git pull --rebase --quiet
            git push --quiet
          }

          if push_once; then
            echo "[stats] stats-gh.ndjson pushed"
          else
            echo "[stats] push failed, retrying once after rebase"
            git pull --rebase --quiet
            if git push --quiet; then
              echo "[stats] stats-gh.ndjson pushed on retry"
            else
              echo "::warning::[stats] could not push stats-gh.ndjson after retry — non-critical, continuing"
            fi
          fi

      - name: Piggyback heartbeat (mitigates flaky GH schedule cron)
        shell: bash {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set +e
          # GitHub's schedule: trigger is unreliable (observed gaps of 3-5h instead of
          # 2h on heartbeat.yml's own cron). retry-vm.yml self-dispatches ~every 5min
          # very reliably, so use that cadence to check whether a heartbeat is overdue
          # and fire one directly if so. heartbeat.yml's cron stays as a backup trigger.
          # NOTE: GitHub's API returns pretty-printed JSON (space after ':'), so the
          # extraction pattern must tolerate optional whitespace or it silently
          # matches nothing — this was making LAST always empty, which made
          # NEED_PING always =1 (piggyback fired every ~5min instead of only when
          # genuinely overdue). Fixed with [[:space:]]* tolerance below.
          RESP=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/heartbeat.yml/runs?status=success&per_page=1")
          LAST=$(echo "$RESP" | grep -o '"created_at"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | grep -o '"[^"]*"$' | tr -d '"')
          NEED_PING=0
          if [ -z "$LAST" ]; then
            echo "[piggyback-hb] no prior successful heartbeat run found — pinging"
            NEED_PING=1
          else
            LE=$(date -d "$LAST" +%s 2>/dev/null)
            [ -z "$LE" ] && LE=0
            if [ "$LE" -le 0 ]; then
              echo "[piggyback-hb] could not parse last heartbeat time ('$LAST') — skipping this cycle"
            else
              GAP=$(( $(date +%s) - LE ))
              echo "[piggyback-hb] last successful heartbeat ${GAP}s ago"
              [ "$GAP" -gt 6600 ] && NEED_PING=1
            fi
          fi

          if [ "$NEED_PING" = "1" ]; then
            PARIS_TIME=$(TZ='Europe/Paris' date '+%H:%M %Z')
            STATS_TEXT=$(python3 stats_report.py --hours 2 2>/dev/null)
            [ -z "$STATS_TEXT" ] && STATS_TEXT="Статистика недоступна (файлы stats-*.ndjson ещё не появились)."
            # Join multiline text into one %0A-separated line — plain bash
            # read-loop, not sed (BSD vs GNU sed disagree on the multi-line idiom).
            STATS_ENCODED=""
            FIRST_LINE=1
            while IFS= read -r LINE; do
              if [ "$FIRST_LINE" = "1" ]; then STATS_ENCODED="$LINE"; FIRST_LINE=0; else STATS_ENCODED="${STATS_ENCODED}%0A${LINE}"; fi
            done <<< "$STATS_TEXT"
            MSG="🟠 Резервное уведомление: обычный heartbeat от GitHub задержался (это известное ограничение расписаний GitHub Actions), поэтому шлю статус напрямую.%0A%0A✅ Хантер жив, ищу A1.Flex.%0A🕐 ${PARIS_TIME}%0A%0A📈 ${STATS_ENCODED}%0A%0A📊 https://github.com/${GH_REPO}/actions"
            OK=0
            for i in 1 2 3; do
              R=$(curl -s --max-time 10 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                -d "chat_id=${TG_CHAT_ID}" -d "text=${MSG}")
              echo "$R" | grep -q '"ok":true' && { OK=1; break; }
              sleep 5
            done
            if [ "$OK" = "1" ]; then
              echo "[piggyback-hb] fallback heartbeat sent via TG"
            else
              echo "::error::[piggyback-hb] fallback TG send failed after 3 retries"
            fi
            # Also try to nudge the real workflow so its own run history reflects
            # the ping (best-effort — do not fail this job if the dispatch fails,
            # the direct TG send above is the actual fallback delivery mechanism).
            curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GH_REPO/actions/workflows/heartbeat.yml/dispatches" \
              -d '{"ref":"main"}' > /dev/null 2>&1
          fi

      - name: Chain next generation + failure alert
        shell: bash {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HUNT_RESULT: ${{ needs.hunt.result }}
        run: |
          set +e
          # Same whitespace-tolerance fix as above (pretty-printed JSON from GitHub's API).
          state=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/retry-vm.yml" \
            | grep -o '"state"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | grep -o '"[^"]*"$' | tr -d '"')
          if [ "$state" = "disabled_manually" ] || [ "$state" = "disabled_inactivity" ]; then
            echo "Workflow disabled ($state) — target reached, not relaunching."
            exit 0
          fi
          sleep 15
          DISPATCH=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/retry-vm.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$DISPATCH" != "204" ]; then
            echo "::error::relaunch dispatch failed (HTTP $DISPATCH) — hunter chain may stop here"
            exit 1
          fi
          echo "Next generation dispatched (hunt result: $HUNT_RESULT)"
