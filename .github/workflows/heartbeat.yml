name: Heartbeat
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send Telegram heartbeat
        shell: bash {0}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          RESP=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/$GH_REPO/actions/workflows/retry-vm.yml/runs?per_page=1")
          RUNS=$(echo "$RESP" | grep -o '"total_count":[0-9]*' | head -1 | cut -d: -f2)
          [ -z "$RUNS" ] && RUNS="?"
          LAST=$(echo "$RESP" | grep -o '"created_at":"[^"]*"' | head -1 | cut -d'"' -f4)
          MARK="green"
          NOTE=""
          if [ -n "$LAST" ]; then
            LE=$(date -d "$LAST" +%s 2>/dev/null)
            [ -z "$LE" ] && LE=0
            GAP=$(( $(date +%s) - LE ))
            if [ "$LE" -gt 0 ] && [ "$GAP" -gt 900 ]; then
              MARK="yellow"
              NOTE="%0A(!) posledniy zapusk ${GAP}s nazad - nudge"
              curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GH_REPO/actions/workflows/retry-vm.yml/dispatches" -d '{"ref":"main"}' >/dev/null 2>&1
            fi
          fi
          EMO=$([ "$MARK" = "green" ] && echo "🟢" || echo "🟡")
          MSG="${EMO} Hunter zhiv, ishchu A1.Flex.%0A🕐 $(date -u '+%H:%M') UTC%0A🔄 vsego zapuskov: ${RUNS}%0A🎯 slot poka ne poyman${NOTE}%0A📊 https://github.com/${GH_REPO}/actions"
          OK=0
          for i in 1 2 3; do
            R=$(curl -s --max-time 10 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d "chat_id=${TG_CHAT_ID}" -d "text=${MSG}")
            echo "$R" | grep -q '"ok":true' && { OK=1; break; }
            sleep 5
          done
          [ "$OK" = "1" ] && echo "heartbeat sent" || echo "::error::TG failed"
