name: Heartbeat
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send Telegram heartbeat
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Count recent successful runs (last 24h)
          runs=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/retry-vm.yml/runs?per_page=100" \
            | grep -c '"status":"completed"' || echo "?")

          msg="🟢 GitHub Hunter жив, ищу слот A1.Flex.%0A%0AСтатус: $(date -u '+%H:%M UTC')%0AЗапусков workflow: ${runs}%0AСлот пока не пойман — продолжаю.%0A%0AЛог: https://github.com/${GH_REPO}/actions"

          curl -s --max-time 10 -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "text=${msg}"
