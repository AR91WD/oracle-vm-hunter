name: Heartbeat
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send Telegram heartbeat
        shell: bash {0}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          # Total hunter runs in last 24h via API total_count
          runs=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/retry-vm.yml/runs?per_page=1&created=>$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            | python3 -c 'import sys,json;
try: print(json.load(sys.stdin).get("total_count","?"))
except: print("?")' 2>/dev/null)
          [ -z "$runs" ] && runs="?"

          # Is hunter fresh? (last run <15 min ago)
          last=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/retry-vm.yml/runs?per_page=1" \
            | grep -o '"created_at":"[^"]*"' | head -1 | cut -d'"' -f4)
          mark="🟢"; note=""
          if [ -n "$last" ]; then
            le=$(date -d "$last" +%s 2>/dev/null || echo 0)
            gap=$(( $(date +%s) - le ))
            if [ "$le" -gt 0 ] && [ "$gap" -gt 900 ]; then
              mark="🟡"; note="%0A⚠️ Последний запуск ${gap}с назад — проверь Actions"
              # nudge a fresh run
              curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GH_REPO/actions/workflows/retry-vm.yml/dispatches" -d '{"ref":"main"}' >/dev/null 2>&1
            fi
          fi

          msg="${mark} Hunter жив, ищу A1.Flex.%0A🕐 $(date -u '+%H:%M UTC')%0A🔄 Запусков за 24ч: ${runs}%0A🎯 Слот пока не пойман${note}%0A📊 https://github.com/${GH_REPO}/actions"

          for i in 1 2 3; do
            curl -s --max-time 10 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" -d "text=${msg}" 2>&1 | grep -q '"ok":true' && exit 0
            sleep 5
          done
          echo "::error::heartbeat TG failed"
