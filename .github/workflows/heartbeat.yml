name: Heartbeat
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Send Telegram heartbeat
        shell: bash {0}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e

          # Real run count scoped to "last 2h" (the heartbeat interval), via the
          # created:>=<ISO8601> query param — total_count is meaningful only when
          # scoped like this (an unscoped total_count is a lifetime counter, not
          # useful context for "is the hunter actively running right now").
          SINCE_ISO=$(date -u -d '2 hours ago' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null)
          if [ -z "$SINCE_ISO" ]; then
            # macOS/BSD date fallback (not expected on ubuntu-latest, kept defensive)
            SINCE_ISO=$(date -u -v-2H '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null)
          fi
          # NOTE: GitHub's API returns pretty-printed JSON (space after ':'), e.g.
          # `"total_count": 27` not `"total_count":27` — a plain [0-9]* pattern
          # with no space tolerance matches zero digits right after the colon and
          # silently returns empty. This was the actual root cause of the "?"
          # counter bug: not just missing date-scoping, but this whitespace gap
          # in the extraction pattern itself. Both are fixed here via [[:space:]]*
          # tolerance and pulling digits from the tail of the match instead of cut.
          RUNS_2H="?"
          if [ -n "$SINCE_ISO" ]; then
            RESP_COUNT=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$GH_REPO/actions/workflows/retry-vm.yml/runs?created=%3E${SINCE_ISO}")
            RUNS_2H=$(echo "$RESP_COUNT" | grep -o '"total_count"[[:space:]]*:[[:space:]]*[0-9]*' | head -1 | grep -o '[0-9]*$')
            [ -z "$RUNS_2H" ] && RUNS_2H="?"
          fi

          # Freshness check (unrelated to the count above): is the hunter chain alive?
          RESP_LAST=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/retry-vm.yml/runs?per_page=1")
          LAST=$(echo "$RESP_LAST" | grep -o '"created_at"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | grep -o '"[^"]*"$' | tr -d '"')
          MARK="green"
          NOTE=""
          if [ -n "$LAST" ]; then
            LE=$(date -d "$LAST" +%s 2>/dev/null)
            [ -z "$LE" ] && LE=0
            GAP=$(( $(date +%s) - LE ))
            if [ "$LE" -gt 0 ] && [ "$GAP" -gt 900 ]; then
              MARK="yellow"
              NOTE="%0A(!) Последний запуск ${GAP}с назад — подталкиваю новый цикл."
              curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GH_REPO/actions/workflows/retry-vm.yml/dispatches" -d '{"ref":"main"}' >/dev/null 2>&1
            fi
          fi
          EMO=$([ "$MARK" = "green" ] && echo "🟢" || echo "🟡")

          # Mac telemetry lives on a DEDICATED branch (telemetry-mac), single-writer
          # by Mac, to avoid the push-contention on main that made Mac stats never
          # land (root cause of the long-standing "Mac: 0"). Fetch the fresh Mac
          # stats from that branch and overwrite the frozen main copy before the
          # report. stats-gh.ndjson stays from the main checkout (GH writes main).
          git fetch origin telemetry-mac --depth 1 >/dev/null 2>&1
          git show origin/telemetry-mac:stats-mac.ndjson > stats-mac.ndjson 2>/dev/null || true

          # Dead/stalled-Mac detector (reviewer point #6): if Mac's newest
          # telemetry record is older than 20 min, the Mac worker has stalled or
          # its delivery broke — surface it explicitly instead of silently
          # showing Mac: 0. GH keeps hunting regardless.
          MAC_STALE=""
          MAC_LAST_TS=$(grep -o '"ts":[0-9]*' stats-mac.ndjson 2>/dev/null | tail -1 | cut -d: -f2)
          if [ -n "$MAC_LAST_TS" ]; then
            MAC_AGE=$(( $(date +%s) - MAC_LAST_TS ))
            if [ "$MAC_AGE" -gt 1200 ]; then
              MAC_STALE="%0A⚠️ Mac-воркер молчит ${MAC_AGE}с (>20мин) — проверь MacBook (GitHub охотится дальше)."
            fi
          fi

          # Real operational telemetry (requests/sizes/AD breakdown/rate) from the
          # checked-out stats-gh.ndjson + telemetry-mac's stats-mac.ndjson, last 2h.
          # stats_report.py never fails hard (missing files -> zeroed report), so
          # this always produces usable text even before the first STATS record lands.
          STATS_TEXT=$(python3 stats_report.py --hours 2 2>/dev/null)
          if [ -z "$STATS_TEXT" ]; then
            STATS_TEXT="Статистика недоступна (файлы stats-*.ndjson ещё не появились)."
          fi
          # Join multiline text into one %0A-separated line for Telegram's text=
          # param. Plain bash read-loop instead of a sed multi-line idiom — BSD vs
          # GNU sed disagree on that syntax and this needs to work identically
          # whether tested locally (BSD) or run on ubuntu-latest (GNU).
          STATS_ENCODED=""
          FIRST_LINE=1
          while IFS= read -r LINE; do
            if [ "$FIRST_LINE" = "1" ]; then STATS_ENCODED="$LINE"; FIRST_LINE=0; else STATS_ENCODED="${STATS_ENCODED}%0A${LINE}"; fi
          done <<< "$STATS_TEXT"

          PARIS_TIME=$(TZ='Europe/Paris' date '+%d.%m.%Y %H:%M %Z')
          MSG="${EMO} Хантер жив, ищу A1.Flex.%0A🗓 Отчёт: ${PARIS_TIME}%0A🔄 Запусков за последние 2ч: ${RUNS_2H}%0A🎯 Слот пока не пойман${NOTE}${MAC_STALE}%0A%0A📈 ${STATS_ENCODED}%0A%0A📊 https://github.com/${GH_REPO}/actions"

          OK=0
          for i in 1 2 3; do
            R=$(curl -s --max-time 10 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d "chat_id=${TG_CHAT_ID}" -d "text=${MSG}")
            echo "$R" | grep -q '"ok":true' && { OK=1; break; }
            sleep 5
          done
          if [ "$OK" = "1" ]; then
            echo "heartbeat sent"
          else
            echo "::error::TG failed after 3 retries"
            exit 1
          fi
